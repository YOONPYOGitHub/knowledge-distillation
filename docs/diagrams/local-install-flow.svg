<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="Arial, Helvetica, sans-serif">

  <!-- Background -->
  <rect width="600" height="520" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="300" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">Local Model Installation Flow</text>

  <!-- Step 1: Hugging Face Hub -->
  <rect x="150" y="55" width="300" height="70" rx="10" fill="#ff9d00"/>
  <text x="300" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Hugging Face Hub</text>
  <text x="300" y="100" text-anchor="middle" font-size="10" fill="#fff8e0">huggingface.co/models</text>
  <text x="300" y="116" text-anchor="middle" font-size="10" fill="#fff8e0">gpt2 (~0.5GB) / distilgpt2 (~0.3GB)</text>

  <!-- Arrow 1 -->
  <line x1="300" y1="125" x2="300" y2="168" stroke="#475569" stroke-width="2"/>
  <polygon points="293,168 300,178 307,168" fill="#475569"/>
  <rect x="320" y="138" width="140" height="22" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="390" y="153" text-anchor="middle" font-size="10" fill="#92400e">First run: Download</text>

  <!-- Step 2: Local Cache -->
  <rect x="150" y="182" width="300" height="60" rx="10" fill="#3b82f6"/>
  <text x="300" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Local Cache</text>
  <text x="300" y="228" text-anchor="middle" font-size="10" fill="#dbeafe">~/.cache/huggingface/hub/</text>

  <!-- Arrow 2 -->
  <line x1="300" y1="242" x2="300" y2="285" stroke="#475569" stroke-width="2"/>
  <polygon points="293,285 300,295 307,285" fill="#475569"/>
  <rect x="320" y="255" width="170" height="22" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
  <text x="405" y="270" text-anchor="middle" font-size="10" fill="#065f46">After: Load from local</text>

  <!-- Step 3: Python Code -->
  <rect x="150" y="300" width="300" height="60" rx="10" fill="#8b5cf6"/>
  <text x="300" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Python Code</text>
  <text x="300" y="345" text-anchor="middle" font-size="10" fill="#ede9fe">model.from_pretrained()</text>

  <!-- Key Features -->
  <rect x="60" y="390" width="480" height="110" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="300" y="415" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Key Features</text>

  <circle cx="100" cy="438" r="4" fill="#22c55e"/>
  <text x="115" y="442" font-size="11" fill="#334155">Auto download on first run</text>

  <circle cx="100" cy="462" r="4" fill="#22c55e"/>
  <text x="115" y="466" font-size="11" fill="#334155">Offline available after download</text>

  <circle cx="340" cy="438" r="4" fill="#22c55e"/>
  <text x="355" y="442" font-size="11" fill="#334155">Weights stored on local disk</text>

  <circle cx="340" cy="462" r="4" fill="#22c55e"/>
  <text x="355" y="466" font-size="11" fill="#334155">No paid API costs</text>

</svg>