<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <linearGradient id="teacherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="studentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="lossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f87171;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">Knowledge Distillation Architecture</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#64748b">Teacher의 Soft Label을 Student가 학습하는 구조</text>

  <!-- Input Data -->
  <rect x="360" y="85" width="180" height="50" rx="10" fill="url(#dataGrad)" filter="url(#shadow)"/>
  <text x="450" y="115" text-anchor="middle" font-size="14" font-weight="600" fill="white">📄 Training Data</text>

  <!-- Arrows from data to models -->
  <line x1="410" y1="135" x2="220" y2="185" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="6,3"/>
  <line x1="490" y1="135" x2="680" y2="185" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="6,3"/>

  <!-- Teacher Model -->
  <rect x="100" y="190" width="240" height="100" rx="12" fill="url(#teacherGrad)" filter="url(#shadow)"/>
  <text x="220" y="225" text-anchor="middle" font-size="16" font-weight="bold" fill="#78350f">🎓 Teacher Model</text>
  <text x="220" y="248" text-anchor="middle" font-size="12" fill="#92400e">gpt2 (124M) · Fine-tuned</text>
  <text x="220" y="268" text-anchor="middle" font-size="11" fill="#92400e" font-style="italic">Domain-adapted, then Frozen</text>

  <!-- Student Model -->
  <rect x="560" y="190" width="240" height="100" rx="12" fill="url(#studentGrad)" filter="url(#shadow)"/>
  <text x="680" y="225" text-anchor="middle" font-size="16" font-weight="bold" fill="white">🧑‍🎓 Student Model</text>
  <text x="680" y="248" text-anchor="middle" font-size="12" fill="#e0f2fe">distilgpt2 (82M params)</text>
  <text x="680" y="268" text-anchor="middle" font-size="11" fill="#e0f2fe" font-style="italic">Trainable — 학습 대상</text>

  <!-- Teacher Output -->
  <rect x="130" y="330" width="180" height="55" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="220" y="354" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">Soft Logits (z_t)</text>
  <text x="220" y="372" text-anchor="middle" font-size="11" fill="#b45309">σ(z_t / T)</text>

  <!-- Student Output -->
  <rect x="590" y="330" width="180" height="55" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="680" y="354" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">Soft Logits (z_s)</text>
  <text x="680" y="372" text-anchor="middle" font-size="11" fill="#1d4ed8">σ(z_s / T)</text>

  <!-- Arrows from models to logits -->
  <line x1="220" y1="290" x2="220" y2="325" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="680" y1="290" x2="680" y2="325" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- KD Loss Box -->
  <rect x="310" y="420" width="280" height="65" rx="10" fill="url(#lossGrad)" filter="url(#shadow)"/>
  <text x="450" y="448" text-anchor="middle" font-size="15" font-weight="bold" fill="white">KL Divergence Loss</text>
  <text x="450" y="470" text-anchor="middle" font-size="11" fill="#fee2e2">T² · KL( σ(z_t/T) ∥ σ(z_s/T) )</text>

  <!-- Hard Label Loss -->
  <rect x="620" y="420" width="200" height="65" rx="10" fill="#fecaca" stroke="#ef4444" stroke-width="1.5"/>
  <text x="720" y="448" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">CE Loss (Hard Label)</text>
  <text x="720" y="468" text-anchor="middle" font-size="11" fill="#b91c1c">L_CE(y, ŷ_student)</text>

  <!-- Arrows to KD Loss -->
  <line x1="310" y1="370" x2="390" y2="415" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="590" y1="370" x2="510" y2="415" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- Arrow from student logits to CE Loss -->
  <line x1="680" y1="385" x2="720" y2="415" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- Total Loss -->
  <rect x="330" y="525" width="240" height="55" rx="10" fill="#1e293b" filter="url(#shadow)"/>
  <text x="450" y="550" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Total Loss (L_total)</text>
  <text x="450" y="569" text-anchor="middle" font-size="11" fill="#94a3b8">α · L_CE + (1-α) · T² · KL</text>

  <!-- Arrows to Total Loss -->
  <line x1="450" y1="485" x2="450" y2="520" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="720" y1="485" x2="530" y2="525" stroke="#555" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Backprop arrow -->
  <path d="M 570 552 Q 800 552 800 280 Q 800 240 750 240" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <text x="820" y="400" text-anchor="middle" font-size="11" fill="#16a34a" font-weight="600" transform="rotate(-90, 820, 400)">Backpropagation</text>

  <!-- Temperature label -->
  <rect x="80" y="420" width="160" height="45" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="160" y="440" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">🌡️ Temperature (T)</text>
  <text x="160" y="456" text-anchor="middle" font-size="11" fill="#15803d">높을수록 Soft 분포</text>

  <!-- Alpha label -->
  <rect x="80" y="475" width="160" height="45" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="160" y="495" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">⚖️ Alpha (α)</text>
  <text x="160" y="511" text-anchor="middle" font-size="11" fill="#b45309">CE vs KD 비율 조절</text>

  <!-- Legend -->
  <rect x="80" y="555" width="200" height="50" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="90" y="572" font-size="10" fill="#64748b">━━ Forward   ┈┈ Data Flow</text>
  <text x="90" y="592" font-size="10" fill="#22c55e">╌╌ Backprop (Student만 업데이트)</text>
</svg>