<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="580" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">4-Way Performance Comparison Design</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#64748b">Teacher vs Student(KD) vs Student(FT) vs Student(Base) — 논문 표준 비교 구조</text>

  <!-- ======= Teacher Column ======= -->
  <rect x="20" y="85" width="210" height="70" rx="10" fill="#f59e0b" filter="url(#shadow)"/>
  <text x="125" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="white">🎓 Teacher</text>
  <text x="125" y="133" text-anchor="middle" font-size="10" fill="#fef3c7">gpt2 (124M) · Fine-tuned</text>

  <rect x="20" y="168" width="210" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="125" y="188" text-anchor="middle" font-size="11" fill="#92400e">도메인 Fine-Tuning 후 Frozen</text>

  <rect x="20" y="210" width="210" height="26" rx="5" fill="white" stroke="#fbbf24" stroke-width="1"/>
  <text x="125" y="228" text-anchor="middle" font-size="10" fill="#78350f">→ Perplexity 측정</text>
  <rect x="20" y="242" width="210" height="26" rx="5" fill="white" stroke="#fbbf24" stroke-width="1"/>
  <text x="125" y="260" text-anchor="middle" font-size="10" fill="#78350f">→ 추론 속도 측정</text>
  <rect x="20" y="274" width="210" height="26" rx="5" fill="white" stroke="#fbbf24" stroke-width="1"/>
  <text x="125" y="292" text-anchor="middle" font-size="10" fill="#78350f">→ 텍스트 생성 품질</text>
  <rect x="20" y="306" width="210" height="26" rx="5" fill="white" stroke="#fbbf24" stroke-width="1"/>
  <text x="125" y="324" text-anchor="middle" font-size="10" fill="#78350f">→ 메모리 사용량</text>

  <!-- ======= Student KD Column ======= -->
  <rect x="255" y="85" width="210" height="70" rx="10" fill="#3b82f6" filter="url(#shadow)"/>
  <text x="360" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="white">🧑‍🎓 Student (KD)</text>
  <text x="360" y="133" text-anchor="middle" font-size="10" fill="#dbeafe">distilgpt2 (82M) · 증류 학습</text>

  <rect x="255" y="168" width="210" height="30" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="360" y="188" text-anchor="middle" font-size="11" fill="#1e40af">KD Loss + CE Loss 학습</text>

  <rect x="255" y="210" width="210" height="26" rx="5" fill="white" stroke="#60a5fa" stroke-width="1"/>
  <text x="360" y="228" text-anchor="middle" font-size="10" fill="#1e3a8a">→ Perplexity 측정</text>
  <rect x="255" y="242" width="210" height="26" rx="5" fill="white" stroke="#60a5fa" stroke-width="1"/>
  <text x="360" y="260" text-anchor="middle" font-size="10" fill="#1e3a8a">→ 추론 속도 측정</text>
  <rect x="255" y="274" width="210" height="26" rx="5" fill="white" stroke="#60a5fa" stroke-width="1"/>
  <text x="360" y="292" text-anchor="middle" font-size="10" fill="#1e3a8a">→ 텍스트 생성 품질</text>
  <rect x="255" y="306" width="210" height="26" rx="5" fill="white" stroke="#60a5fa" stroke-width="1"/>
  <text x="360" y="324" text-anchor="middle" font-size="10" fill="#1e3a8a">→ 메모리 사용량</text>

  <!-- ======= Student FT Column ======= -->
  <rect x="490" y="85" width="210" height="70" rx="10" fill="#10b981" filter="url(#shadow)"/>
  <text x="595" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="white">📝 Student (FT)</text>
  <text x="595" y="133" text-anchor="middle" font-size="10" fill="#d1fae5">distilgpt2 (82M) · Fine-tuning</text>

  <rect x="490" y="168" width="210" height="30" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
  <text x="595" y="188" text-anchor="middle" font-size="11" fill="#065f46">CE Loss만으로 학습</text>

  <rect x="490" y="210" width="210" height="26" rx="5" fill="white" stroke="#34d399" stroke-width="1"/>
  <text x="595" y="228" text-anchor="middle" font-size="10" fill="#064e3b">→ Perplexity 측정</text>
  <rect x="490" y="242" width="210" height="26" rx="5" fill="white" stroke="#34d399" stroke-width="1"/>
  <text x="595" y="260" text-anchor="middle" font-size="10" fill="#064e3b">→ 추론 속도 측정</text>
  <rect x="490" y="274" width="210" height="26" rx="5" fill="white" stroke="#34d399" stroke-width="1"/>
  <text x="595" y="292" text-anchor="middle" font-size="10" fill="#064e3b">→ 텍스트 생성 품질</text>
  <rect x="490" y="306" width="210" height="26" rx="5" fill="white" stroke="#34d399" stroke-width="1"/>
  <text x="595" y="324" text-anchor="middle" font-size="10" fill="#064e3b">→ 메모리 사용량</text>

  <!-- ======= Student Base Column ======= -->
  <rect x="725" y="85" width="210" height="70" rx="10" fill="#6b7280" filter="url(#shadow)"/>
  <text x="830" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="white">📦 Student (Base)</text>
  <text x="830" y="133" text-anchor="middle" font-size="10" fill="#e5e7eb">distilgpt2 (82M) · 원본 그대로</text>

  <rect x="725" y="168" width="210" height="30" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
  <text x="830" y="188" text-anchor="middle" font-size="11" fill="#374151">추가 학습 없음 (Pretrained)</text>

  <rect x="725" y="210" width="210" height="26" rx="5" fill="white" stroke="#9ca3af" stroke-width="1"/>
  <text x="830" y="228" text-anchor="middle" font-size="10" fill="#374151">→ Perplexity 측정</text>
  <rect x="725" y="242" width="210" height="26" rx="5" fill="white" stroke="#9ca3af" stroke-width="1"/>
  <text x="830" y="260" text-anchor="middle" font-size="10" fill="#374151">→ 추론 속도 측정</text>
  <rect x="725" y="274" width="210" height="26" rx="5" fill="white" stroke="#9ca3af" stroke-width="1"/>
  <text x="830" y="292" text-anchor="middle" font-size="10" fill="#374151">→ 텍스트 생성 품질</text>
  <rect x="725" y="306" width="210" height="26" rx="5" fill="white" stroke="#9ca3af" stroke-width="1"/>
  <text x="830" y="324" text-anchor="middle" font-size="10" fill="#374151">→ 메모리 사용량</text>

  <!-- ======= Comparison arrows ======= -->
  <line x1="230" y1="120" x2="255" y2="120" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="465" y1="120" x2="490" y2="120" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="700" y1="120" x2="725" y2="120" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ======= Analysis Section ======= -->
  <rect x="20" y="360" width="915" height="50" rx="10" fill="#1e293b" filter="url(#shadow)"/>
  <text x="480" y="390" text-anchor="middle" font-size="14" font-weight="bold" fill="white">📊 비교 분석 — 3가지 질문에 답한다</text>

  <!-- Question boxes -->
  <rect x="20" y="425" width="295" height="65" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="167" y="448" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Q1: 압축 손실은?</text>
  <text x="167" y="465" text-anchor="middle" font-size="10" fill="#b45309">Teacher vs Student(KD)</text>
  <text x="167" y="480" text-anchor="middle" font-size="9" fill="#78350f">→ 모델 축소로 인한 성능 하락 측정</text>

  <rect x="332" y="425" width="295" height="65" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="479" y="448" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">Q2: 증류 효과는?</text>
  <text x="479" y="465" text-anchor="middle" font-size="10" fill="#2563eb">Student(KD) vs Student(FT)</text>
  <text x="479" y="480" text-anchor="middle" font-size="9" fill="#1e3a8a">→ 증류가 자체 학습 대비 얼마나 효과?</text>

  <rect x="644" y="425" width="291" height="65" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="789" y="448" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">Q3: Fine-tuning 효과는?</text>
  <text x="789" y="465" text-anchor="middle" font-size="10" fill="#059669">Student(FT) vs Student(Base)</text>
  <text x="789" y="480" text-anchor="middle" font-size="9" fill="#064e3b">→ 추가 학습 자체의 가치 측정</text>

  <!-- Expected performance order -->
  <rect x="20" y="505" width="915" height="55" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="480" y="528" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">기대 성능 순서 (Perplexity 기준, 낮을수록 좋음)</text>
  <text x="480" y="548" text-anchor="middle" font-size="13" fill="#1e293b">
    <tspan fill="#f59e0b" font-weight="bold">Teacher</tspan>
    <tspan fill="#64748b"> &lt; </tspan>
    <tspan fill="#3b82f6" font-weight="bold">Student(KD)</tspan>
    <tspan fill="#64748b"> &lt; </tspan>
    <tspan fill="#10b981" font-weight="bold">Student(FT)</tspan>
    <tspan fill="#64748b"> &lt; </tspan>
    <tspan fill="#6b7280" font-weight="bold">Student(Base)</tspan>
  </text>
</svg>