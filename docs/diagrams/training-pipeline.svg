<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 920" font-family="Arial, Helvetica, sans-serif">

  <!-- Background -->
  <rect width="900" height="920" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Training Pipeline - 5 Steps</text>
  <text x="450" y="55" text-anchor="middle" font-size="12" fill="#64748b">Teacher FT → KD / FT / Base → Evaluate → Compare</text>

  <!-- Step 1 -->
  <rect x="300" y="75" width="300" height="50" rx="10" fill="#8b5cf6"/>
  <text x="450" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Step 1 - Data Preparation</text>
  <text x="450" y="115" text-anchor="middle" font-size="10" fill="#ede9fe">WikiText Load / Tokenize / DataLoader</text>
  <!-- Arrow down -->
  <line x1="450" y1="125" x2="450" y2="148" stroke="#475569" stroke-width="2"/>
  <polygon points="443,148 450,158 457,148" fill="#475569"/>

  <!-- Step 2: Teacher Fine-Tuning (NEW) -->
  <rect x="300" y="160" width="300" height="50" rx="10" fill="#f59e0b"/>
  <text x="450" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Step 2 - Teacher Fine-Tuning</text>
  <text x="450" y="200" text-anchor="middle" font-size="10" fill="#fef3c7">Domain adaptation (CE Loss, LR=2e-5)</text>
  <!-- Arrow down -->
  <line x1="450" y1="210" x2="450" y2="233" stroke="#475569" stroke-width="2"/>
  <polygon points="443,233 450,243 457,233" fill="#475569"/>

  <!-- Teacher FT output -->
  <rect x="330" y="245" width="240" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="450" y="265" text-anchor="middle" font-size="10" fill="#92400e">teacher_ft_best.pt (domain-adapted)</text>
  <!-- Arrow down -->
  <line x1="450" y1="275" x2="450" y2="293" stroke="#475569" stroke-width="2"/>
  <polygon points="443,293 450,303 457,293" fill="#475569"/>

  <!-- Step 3: Model Load -->
  <rect x="300" y="305" width="300" height="50" rx="10" fill="#6366f1"/>
  <text x="450" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Step 3 - Model Load</text>
  <text x="450" y="345" text-anchor="middle" font-size="10" fill="#e0e7ff">Teacher (FT, frozen) + Student (trainable)</text>
  <!-- Arrow down -->
  <line x1="450" y1="355" x2="450" y2="373" stroke="#475569" stroke-width="2"/>

  <!-- Branch point -->
  <circle cx="450" cy="385" r="14" fill="#1e293b"/>
  <text x="450" y="390" text-anchor="middle" font-size="14" fill="white" font-weight="bold">V</text>

  <!-- Branch lines -->
  <line x1="436" y1="390" x2="155" y2="446" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="148,443 155,453 162,443" fill="#3b82f6"/>

  <line x1="450" y1="399" x2="450" y2="446" stroke="#10b981" stroke-width="2"/>
  <polygon points="443,446 450,456 457,446" fill="#10b981"/>

  <line x1="464" y1="390" x2="745" y2="446" stroke="#6b7280" stroke-width="2"/>
  <polygon points="738,443 745,453 752,443" fill="#6b7280"/>

  <!-- Branch Labels -->
  <text x="270" y="422" text-anchor="middle" font-size="11" fill="#3b82f6" font-weight="600">Path A: Knowledge Distillation</text>
  <text x="450" y="440" text-anchor="middle" font-size="11" fill="#10b981" font-weight="600">Path B: Fine-tuning</text>
  <text x="640" y="422" text-anchor="middle" font-size="11" fill="#6b7280" font-weight="600">Path C: No Training</text>

  <!-- Path A: KD -->
  <rect x="25" y="458" width="260" height="52" rx="10" fill="#3b82f6"/>
  <text x="155" y="480" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Step 3A - Distillation</text>
  <text x="155" y="498" text-anchor="middle" font-size="10" fill="#dbeafe">Teacher(FT) soft logits → Student KD</text>

  <rect x="25" y="518" width="260" height="32" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="155" y="539" text-anchor="middle" font-size="10" fill="#1e40af">L = α·CE + (1-α)·T²·KL  |  T=2.0, α=0.3</text>

  <!-- Path B: FT -->
  <rect x="320" y="458" width="260" height="52" rx="10" fill="#10b981"/>
  <text x="450" y="480" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Step 3B - Fine-tuning</text>
  <text x="450" y="498" text-anchor="middle" font-size="10" fill="#d1fae5">Hard label only Student training</text>

  <rect x="320" y="518" width="260" height="32" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="450" y="539" text-anchor="middle" font-size="10" fill="#065f46">L = CE(y, y_student)  |  Same config</text>

  <!-- Path C: Base -->
  <rect x="615" y="458" width="260" height="52" rx="10" fill="#6b7280"/>
  <text x="745" y="480" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Step 3C - Skip</text>
  <text x="745" y="498" text-anchor="middle" font-size="10" fill="#e5e7eb">No additional training</text>

  <rect x="615" y="518" width="260" height="32" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
  <text x="745" y="539" text-anchor="middle" font-size="10" fill="#374151">Pretrained distilgpt2 as-is</text>

  <!-- Arrows down to output models -->
  <line x1="155" y1="550" x2="155" y2="583" stroke="#475569" stroke-width="2"/>
  <polygon points="148,583 155,593 162,583" fill="#475569"/>

  <line x1="450" y1="550" x2="450" y2="583" stroke="#475569" stroke-width="2"/>
  <polygon points="443,583 450,593 457,583" fill="#475569"/>

  <line x1="745" y1="550" x2="745" y2="583" stroke="#475569" stroke-width="2"/>
  <polygon points="738,583 745,593 752,583" fill="#475569"/>

  <!-- Output models -->
  <rect x="40" y="596" width="230" height="35" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="155" y="618" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">Student (KD) Model</text>

  <rect x="335" y="596" width="230" height="35" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="450" y="618" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">Student (FT) Model</text>

  <rect x="630" y="596" width="230" height="35" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="745" y="618" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">Student (Base) Model</text>

  <!-- Merge arrows to evaluation -->
  <line x1="155" y1="631" x2="365" y2="703" stroke="#475569" stroke-width="2"/>
  <polygon points="358,700 365,710 372,700" fill="#475569"/>

  <line x1="450" y1="631" x2="450" y2="703" stroke="#475569" stroke-width="2"/>
  <polygon points="443,703 450,713 457,703" fill="#475569"/>

  <line x1="745" y1="631" x2="535" y2="703" stroke="#475569" stroke-width="2"/>
  <polygon points="528,700 535,710 542,700" fill="#475569"/>

  <!-- Teacher to evaluation -->
  <rect x="350" y="666" width="200" height="25" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="450" y="683" text-anchor="middle" font-size="10" fill="#92400e">+ Teacher (FT) Model (Upper Bound)</text>

  <!-- Step 4 -->
  <rect x="275" y="715" width="350" height="52" rx="10" fill="#059669"/>
  <text x="450" y="738" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Step 4 - 4-Way Evaluation</text>
  <text x="450" y="756" text-anchor="middle" font-size="10" fill="#d1fae5">Perplexity, Speed, Memory, Generation Quality</text>
  <!-- Arrow down -->
  <line x1="450" y1="767" x2="450" y2="790" stroke="#475569" stroke-width="2"/>
  <polygon points="443,790 450,800 457,790" fill="#475569"/>

  <!-- Step 5 -->
  <rect x="275" y="803" width="350" height="52" rx="10" fill="#1e293b"/>
  <text x="450" y="826" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Step 5 - Compare &amp; Visualize</text>
  <text x="450" y="844" text-anchor="middle" font-size="10" fill="#94a3b8">Q1: Compression / Q2: KD Effect / Q3: FT Effect</text>

  <!-- Pipeline note -->
  <rect x="30" y="875" width="840" height="30" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="450" y="895" text-anchor="middle" font-size="10" fill="#166534">New: Teacher Fine-Tuning (Step 2) ensures domain-adapted soft targets, dramatically improving KD effectiveness</text>
</svg>