<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <linearGradient id="frontendGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fb7185;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e11d48;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="backendGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="storageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff1f2;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffe4e6;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="routeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ecfdf5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d1fae5;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="720" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">KD Evaluation UI — 전체 아키텍처</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#64748b">Streamlit · FastAPI · 기존 학습 코어 재활용</text>

  <!-- ═══════════════ Layer 1: Streamlit Frontend ═══════════════ -->
  <rect x="40" y="85" width="920" height="145" rx="12" fill="url(#frontendGrad)" opacity="0.12" stroke="#e11d48" stroke-width="1.5"/>
  <rect x="40" y="85" width="200" height="30" rx="12" fill="url(#frontendGrad)"/>
  <text x="140" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="white">🎨 Streamlit Frontend</text>
  <text x="955" y="105" text-anchor="end" font-size="11" fill="#9f1239" font-style="italic">:8501</text>

  <!-- Pages grid: 7 pages -->
  <g font-size="11" fill="#9f1239">
    <rect x="60"  y="130" width="122" height="42" rx="6" fill="url(#pageGrad)" stroke="#fb7185" stroke-width="1" filter="url(#shadow)"/>
    <text x="121" y="148" text-anchor="middle" font-weight="600">1. Compare</text>
    <text x="121" y="164" text-anchor="middle" font-size="10">Generate ⚡stream</text>

    <rect x="190" y="130" width="122" height="42" rx="6" fill="url(#pageGrad)" stroke="#fb7185" stroke-width="1" filter="url(#shadow)"/>
    <text x="251" y="148" text-anchor="middle" font-weight="600">2. Experiment</text>
    <text x="251" y="164" text-anchor="middle" font-size="10">Report · 6 tabs</text>

    <rect x="320" y="130" width="122" height="42" rx="6" fill="url(#pageGrad)" stroke="#fb7185" stroke-width="1" filter="url(#shadow)"/>
    <text x="381" y="148" text-anchor="middle" font-weight="600">3. Checkpoint</text>
    <text x="381" y="164" text-anchor="middle" font-size="10">Browser</text>

    <rect x="450" y="130" width="122" height="42" rx="6" fill="url(#pageGrad)" stroke="#fb7185" stroke-width="1" filter="url(#shadow)"/>
    <text x="511" y="148" text-anchor="middle" font-weight="600">4. Blind</text>
    <text x="511" y="164" text-anchor="middle" font-size="10">Evaluation A/B/C</text>

    <rect x="580" y="130" width="122" height="42" rx="6" fill="url(#pageGrad)" stroke="#fb7185" stroke-width="1" filter="url(#shadow)"/>
    <text x="641" y="148" text-anchor="middle" font-weight="600">5. Aggregation</text>
    <text x="641" y="164" text-anchor="middle" font-size="10">집계 대시보드</text>

    <rect x="710" y="130" width="122" height="42" rx="6" fill="url(#pageGrad)" stroke="#fb7185" stroke-width="1" filter="url(#shadow)"/>
    <text x="771" y="148" text-anchor="middle" font-weight="600">6. Token</text>
    <text x="771" y="164" text-anchor="middle" font-size="10">Analysis · KL</text>

    <rect x="840" y="130" width="110" height="42" rx="6" fill="url(#pageGrad)" stroke="#fb7185" stroke-width="1" filter="url(#shadow)"/>
    <text x="895" y="148" text-anchor="middle" font-weight="600">7. Batch</text>
    <text x="895" y="164" text-anchor="middle" font-size="10">Prompts · CSV</text>
  </g>

  <!-- utils -->
  <rect x="60" y="185" width="890" height="32" rx="6" fill="#fff" stroke="#fda4af" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="80" y="206" font-size="11" font-weight="600" fill="#9f1239">utils/</text>
  <text x="130" y="206" font-size="11" fill="#475569">api_client.py (sync · stream · batch)  ·  state.py  ·  prompts.py</text>

  <!-- Arrow: Frontend → Backend -->
  <line x1="500" y1="230" x2="500" y2="278" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="515" y="258" font-size="11" fill="#2563eb" font-weight="600">HTTP · JSON · SSE</text>

  <!-- ═══════════════ Layer 2: FastAPI Backend ═══════════════ -->
  <rect x="40" y="285" width="920" height="175" rx="12" fill="url(#backendGrad)" opacity="0.12" stroke="#059669" stroke-width="1.5"/>
  <rect x="40" y="285" width="200" height="30" rx="12" fill="url(#backendGrad)"/>
  <text x="140" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="white">⚙️ FastAPI Backend</text>
  <text x="955" y="305" text-anchor="end" font-size="11" fill="#065f46" font-style="italic">:8000 · /docs</text>

  <!-- Routers row 1 -->
  <g font-size="10.5" fill="#065f46">
    <rect x="60"  y="330" width="145" height="40" rx="6" fill="url(#routeGrad)" stroke="#34d399" stroke-width="1" filter="url(#shadow)"/>
    <text x="132" y="347" text-anchor="middle" font-weight="600">runs.py</text>
    <text x="132" y="361" text-anchor="middle" font-size="9.5">GET /runs · /history · /evaluation</text>

    <rect x="215" y="330" width="145" height="40" rx="6" fill="url(#routeGrad)" stroke="#34d399" stroke-width="1" filter="url(#shadow)"/>
    <text x="287" y="347" text-anchor="middle" font-weight="600">generate.py</text>
    <text x="287" y="361" text-anchor="middle" font-size="9.5">POST /generate · /models/load</text>

    <rect x="370" y="330" width="145" height="40" rx="6" fill="url(#routeGrad)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="442" y="347" text-anchor="middle" font-weight="600">generate_stream.py</text>
    <text x="442" y="361" text-anchor="middle" font-size="9.5">POST /generate/stream (SSE)</text>

    <rect x="525" y="330" width="145" height="40" rx="6" fill="url(#routeGrad)" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="597" y="347" text-anchor="middle" font-weight="600">generate_batch.py</text>
    <text x="597" y="361" text-anchor="middle" font-size="9.5">POST /generate/batch</text>

    <rect x="680" y="330" width="135" height="40" rx="6" fill="url(#routeGrad)" stroke="#34d399" stroke-width="1" filter="url(#shadow)"/>
    <text x="747" y="347" text-anchor="middle" font-weight="600">token_analysis.py</text>
    <text x="747" y="361" text-anchor="middle" font-size="9.5">POST /token-analysis</text>

    <rect x="825" y="330" width="125" height="40" rx="6" fill="url(#routeGrad)" stroke="#34d399" stroke-width="1" filter="url(#shadow)"/>
    <text x="887" y="347" text-anchor="middle" font-weight="600">feedback.py</text>
    <text x="887" y="361" text-anchor="middle" font-size="9.5">/feedback/save · entries</text>
  </g>

  <!-- Service layer under routers -->
  <rect x="60" y="385" width="890" height="62" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="80" y="405" font-size="11" font-weight="600" fill="#065f46">Services</text>
  <g font-size="10.5" fill="#334155">
    <text x="80" y="425">• model_registry.py — run_id → 체크포인트 LRU 캐시 (default 2 runs)</text>
    <text x="80" y="440">• generator.py — 동기/스트리밍 공통 생성 · token_analyzer.py — top-k + KL · results_reader.py — summary/history 파싱</text>
  </g>

  <!-- Arrow: Backend → Core -->
  <line x1="280" y1="460" x2="280" y2="508" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="295" y="488" font-size="11" fill="#475569" font-weight="600">import</text>

  <!-- Arrow: Backend → Storage -->
  <line x1="880" y1="460" x2="880" y2="503" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  <text x="895" y="485" font-size="11" fill="#475569" font-weight="600">read / write</text>

  <!-- ═══════════════ Layer 3: src/ core ═══════════════ -->
  <rect x="40" y="515" width="520" height="75" rx="12" fill="url(#coreGrad)" opacity="0.15" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="40" y="515" width="200" height="28" rx="12" fill="url(#coreGrad)"/>
  <text x="140" y="534" text-anchor="middle" font-size="13" font-weight="bold" fill="white">📦 src/ (기존 학습 코어)</text>

  <g font-size="11" fill="#1e3a8a">
    <text x="60"  y="562">models.py</text>
    <text x="150" y="562">dataset.py</text>
    <text x="240" y="562">config.py</text>
    <text x="320" y="562">evaluate.py</text>
    <text x="420" y="562">compare.py</text>
    <text x="60"  y="580" font-style="italic" fill="#64748b">재활용 · 변경 최소화</text>
  </g>

  <!-- ═══════════════ Layer 4: Storage ═══════════════ -->
  <rect x="580" y="510" width="380" height="180" rx="12" fill="url(#storageGrad)" opacity="0.15" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="580" y="510" width="170" height="28" rx="12" fill="url(#storageGrad)"/>
  <text x="665" y="529" text-anchor="middle" font-size="13" font-weight="bold" fill="white">💾 results/</text>

  <g font-size="11" fill="#4c1d95">
    <rect x="600" y="555" width="340" height="36" rx="5" fill="#fff" stroke="#c4b5fd" stroke-width="1"/>
    <text x="610" y="570" font-weight="600">checkpoints/{run_id}/</text>
    <text x="610" y="584" font-size="10" fill="#475569">teacher_ft · student_kd · student_ft · _best.pt</text>

    <rect x="600" y="598" width="340" height="36" rx="5" fill="#fff" stroke="#c4b5fd" stroke-width="1"/>
    <text x="610" y="613" font-weight="600">logs/{run_id}/</text>
    <text x="610" y="627" font-size="10" fill="#475569">summary · baseline/distill/teacher history · evaluation</text>

    <rect x="600" y="641" width="340" height="36" rx="5" fill="#fff" stroke="#c4b5fd" stroke-width="1"/>
    <text x="610" y="656" font-weight="600">figures/{run_id}/</text>
    <text x="610" y="670" font-size="10" fill="#475569">PNG (compare / hyper scan / loss curves)</text>
  </g>

  <!-- Footer legend -->
  <text x="40" y="708" font-size="10" fill="#64748b">
    <tspan font-weight="600" fill="#e11d48">━</tspan> Frontend
    <tspan dx="12" font-weight="600" fill="#059669">━</tspan> Backend
    <tspan dx="12" font-weight="600" fill="#2563eb">━</tspan> Core
    <tspan dx="12" font-weight="600" fill="#7c3aed">━</tspan> Storage
    <tspan dx="20" fill="#64748b">· 굵은 테두리 = v0.6 신규 (스트리밍 / 배치)</tspan>
  </text>
</svg>
