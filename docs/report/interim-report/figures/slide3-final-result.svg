<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', 'Apple SD Gothic Neo', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#f8fafc"/>

  <!-- Title -->
  <text x="640" y="50" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">최종 결과 — KD가 FT를 역전 (exp08)</text>
  <text x="640" y="78" text-anchor="middle" font-size="14" fill="#64748b">프로젝트 최초의 Teacher &lt; KD &lt; FT &lt; Base 순서 달성</text>

  <!-- ============================================ -->
  <!-- Section A: PPL bars (left)                   -->
  <!-- ============================================ -->
  <g transform="translate(40, 110)">
    <rect width="600" height="450" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="300" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Perplexity 비교 (낮을수록 좋음)</text>

    <!-- Y axis -->
    <line x1="80" y1="80" x2="80" y2="380" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="80" y1="380" x2="560" y2="380" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Y labels -->
    <g font-size="11" fill="#94a3b8" text-anchor="end">
      <text x="72" y="84">70</text>
      <text x="72" y="127">60</text>
      <text x="72" y="170">50</text>
      <text x="72" y="213">40</text>
      <text x="72" y="256">30</text>
      <text x="72" y="299">20</text>
      <text x="72" y="342">10</text>
      <text x="72" y="385">0</text>
    </g>

    <!-- Bars: scale 1 PPL = 4.3 px (0~70 in 300px) -->
    <!-- Teacher FT: 25.10 → height = 25.10 * 4.286 = 107.6 -->
    <rect x="120" y="272" width="80" height="108" rx="4" fill="#f59e0b"/>
    <text x="160" y="265" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">25.10</text>
    <text x="160" y="400" text-anchor="middle" font-size="12" fill="#475569">Teacher (FT)</text>
    <text x="160" y="416" text-anchor="middle" font-size="10" fill="#94a3b8">Upper Bound</text>

    <!-- Student KD: 32.44 → height = 139 -->
    <rect x="225" y="241" width="80" height="139" rx="4" fill="#3b82f6"/>
    <text x="265" y="234" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">32.44</text>
    <text x="265" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">Student (KD) ⭐</text>
    <text x="265" y="416" text-anchor="middle" font-size="10" fill="#3b82f6">우리 모델</text>

    <!-- Student FT: 32.82 → height = 141 -->
    <rect x="330" y="239" width="80" height="141" rx="4" fill="#10b981"/>
    <text x="370" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">32.82</text>
    <text x="370" y="400" text-anchor="middle" font-size="12" fill="#475569">Student (FT)</text>
    <text x="370" y="416" text-anchor="middle" font-size="10" fill="#94a3b8">기준선</text>

    <!-- Student Base: 65.27 → height = 280 -->
    <rect x="435" y="100" width="80" height="280" rx="4" fill="#94a3b8"/>
    <text x="475" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">65.27</text>
    <text x="475" y="400" text-anchor="middle" font-size="12" fill="#475569">Student (Base)</text>
    <text x="475" y="416" text-anchor="middle" font-size="10" fill="#94a3b8">Lower Bound</text>

    <!-- Highlight arrow KD < FT -->
    <path d="M 265 220 Q 305 200 370 220" stroke="#16a34a" stroke-width="2" fill="none" stroke-dasharray="4,2"/>
    <text x="320" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#16a34a">KD &lt; FT (−0.38)</text>

    <!-- Caption -->
    <text x="300" y="445" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">
      기대했던 Teacher &lt; KD &lt; FT &lt; Base 순서를 처음으로 달성
    </text>
  </g>

  <!-- ============================================ -->
  <!-- Section B: Key insights (right)              -->
  <!-- ============================================ -->
  <g transform="translate(680, 110)">
    <text x="280" y="20" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">핵심 인사이트</text>

    <!-- Card 1: Performance -->
    <g transform="translate(0, 40)">
      <rect width="560" height="115" rx="10" fill="white" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
      <text x="30" y="42" font-size="28">✅</text>
      <text x="75" y="38" font-size="16" font-weight="bold" fill="#1e293b">성능 — KD가 FT를 일반화 측면에서 능가</text>
      <text x="75" y="62" font-size="13" fill="#475569">PPL 32.44 (KD) &lt; 32.82 (FT) · Base 65.27 대비 50% 개선</text>
      <text x="75" y="85" font-size="13" font-weight="bold" fill="#16a34a">정규화 효과: train-val gap 4.3× 작음</text>
      <text x="75" y="103" font-size="11" fill="#94a3b8">FT: 0.849 / KD: 0.197 — soft target이 label smoothing 역할</text>
    </g>

    <!-- Card 2: Speed -->
    <g transform="translate(0, 175)">
      <rect width="560" height="115" rx="10" fill="white" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
      <text x="30" y="42" font-size="28">⚡</text>
      <text x="75" y="38" font-size="16" font-weight="bold" fill="#1e293b">속도 — Student의 경량 아키텍처를 그대로 유지</text>
      <text x="75" y="62" font-size="13" fill="#475569">Student 22,075 tok/s vs Teacher 14,023 tok/s · 모델 크기 34% 감소</text>
      <text x="75" y="85" font-size="13" font-weight="bold" fill="#3b82f6">Teacher 대비 1.57× 빠름</text>
      <text x="75" y="103" font-size="11" fill="#94a3b8">큰 모델의 성능을 작은 모델의 속도로 근사 — KD의 실용적 가치</text>
    </g>

    <!-- Card 3: Limitation -->
    <g transform="translate(0, 310)">
      <rect width="560" height="115" rx="10" fill="white" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
      <text x="30" y="42" font-size="28">⚠</text>
      <text x="75" y="38" font-size="16" font-weight="bold" fill="#1e293b">한계 — 로컬 환경 / 영문 일반 데이터 제약</text>
      <text x="75" y="62" font-size="13" fill="#475569">WikiText-2 (영문 위키) · MacBook MPS · 124M 규모</text>
      <text x="75" y="85" font-size="13" font-weight="bold" fill="#f59e0b">Phase 1: GPU 센터 재검증 → Phase 2: 실버케어 적용</text>
      <text x="75" y="103" font-size="11" fill="#94a3b8">PPL 계산·padding 처리 정합성도 함께 점검 예정</text>
    </g>
  </g>

  <!-- Footer note -->
  <text x="640" y="690" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">
    Run: 20260410_041631 · α=0.2 · T=2.0 · Epochs=8 · Teacher FT 3 ep
  </text>
</svg>
