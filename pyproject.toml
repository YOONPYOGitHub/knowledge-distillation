[project]
name = "knowledge-distillation"
version = "0.1.0"
description = "LLM Knowledge Distillation - Teacher 모델의 지식을 Student 모델로 증류하는 실험 프로젝트"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.45.0,<5.0.0",
    "datasets>=2.14.0,<4.0.0",
    "accelerate>=0.24.0",
    "peft>=0.13.0,<1.0.0",
    "tokenizers>=0.20.0,<0.22.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "streamlit>=1.32.0",
    "plotly>=5.18.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]
