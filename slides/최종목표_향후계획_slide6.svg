<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080">
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <text x="80" y="80" font-family="Noto Sans, Arial" font-size="28" fill="#0066CC" font-weight="700">[비즈니스] 공공 의료 데이터 + 13B 온디바이스 모델로 시니어 의료 접근성 혁신</text>

  <!-- Sections -->
  <rect x="120" y="140" width="1680" height="120" rx="8" fill="#FFDCDC" />
  <text x="160" y="210" font-size="18" fill="#333333">● 문제: 독거·저사양·통신 불안정 환경의 시니어는 의료 정보 접근 어려움 → 응급 대응 지연</text>

  <rect x="120" y="280" width="1680" height="120" rx="8" fill="#FFFCE8" />
  <text x="160" y="350" font-size="18" fill="#333333">● 해결책: 공공 의료 데이터 기반 신뢰 확보 / 13B 경량 모델로 오프라인 작동 / 정확도 90% 이상 → 의료 안전 보장</text>

  <rect x="120" y="420" width="1680" height="120" rx="8" fill="#E8F0FF" />
  <text x="160" y="490" font-size="18" fill="#333333">● 단계: Pilot (500 Q&amp;A) → Beta (3,000 Q&amp;A) → Full (10,000 Q&amp;A) / 각 단계 GO/NO-GO 결정</text>

  <rect x="120" y="560" width="1680" height="120" rx="8" fill="#E8FFE8" />
  <text x="160" y="630" font-size="18" fill="#333333">● 기대효과: 시니어 의료 접근성 향상 / 의료법·개인정보보호법 준수 / 한국 공공 의료 데이터 활용 사례</text>

  <rect x="120" y="820" width="1680" height="160" rx="8" fill="#FFF5E0" stroke="#FF9500" stroke-width="2" />
  <text x="960" y="900" font-size="20" fill="#FF9500" font-weight="700" text-anchor="middle">→ 데이터·모델·평가를 3단계로 체계화해 의료 안전 기준을 충족하면서도 현실적 배포 실현</text>
</svg>
