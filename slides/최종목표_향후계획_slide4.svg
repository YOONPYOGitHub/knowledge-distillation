<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080">
  <rect width="100%" height="100%" fill="#FFFFFF" />
  <text x="80" y="80" font-family="Noto Sans, Arial" font-size="28" fill="#0066CC" font-weight="700">[안전] 온디바이스 오프라인 서비스 vs 클라우드 기반 서비스 비교</text>

  <!-- Left: On-device -->
  <rect x="120" y="140" width="820" height="700" rx="12" fill="#E8FFF0" stroke="#00B050" stroke-width="3"/>
  <text x="530" y="200" font-size="22" fill="#00B050" font-weight="700" text-anchor="middle">✓ 온디바이스 오프라인 (우리 방식)</text>
  <text x="200" y="260" font-size="18">• 통신 불필요 (와이파이·데이터 없어도 작동)</text>
  <text x="200" y="300" font-size="18">• 건강정보 외부 전송 안 함 (프라이버시)</text>
  <text x="200" y="340" font-size="18">• 응답 속도 2초 이내 (로컬 처리)</text>
  <text x="200" y="380" font-size="18">• 오래된 스마트폰도 지원 (4GB RAM)</text>
  <text x="200" y="420" font-size="18">• 규제 리스크 낮음 (로컬 처리)</text>

  <!-- Right: Cloud -->
  <rect x="980" y="140" width="820" height="700" rx="12" fill="#F5F5F5" stroke="#CCCCCC" stroke-width="2"/>
  <text x="1390" y="200" font-size="22" fill="#666666" font-weight="700" text-anchor="middle">클라우드 기반 (참고)</text>
  <text x="1000" y="260" font-size="18">• 고성능 모델 가능 (대형 LLM)</text>
  <text x="1000" y="300" font-size="18">• 실시간 업데이트 용이</text>
  <text x="1000" y="340" font-size="18">• 서버 비용 발생</text>
  <text x="1000" y="380" font-size="18">• 네트워크 의존도 높음</text>
  <text x="1000" y="420" font-size="18">• 개인정보보호법·의료법 준수 필수</text>

  <rect x="120" y="880" width="1680" height="120" rx="8" fill="#FFF5E0" stroke="#FF9500" stroke-width="2"/>
  <text x="960" y="954" font-size="20" fill="#FF9500" font-weight="700" text-anchor="middle">→ 시니어 의료 서비스는 프라이버시·접근성·안전성을 우선해 온디바이스 오프라인 선택</text>
</svg>
