# 참가자 C: general-purpose Llama family
# Hugging Face에서 Llama 3.2 사용 약관 승인과 HF_TOKEN 설정 필요
# 실행: python main.py configs/exp11_korean_llama.yaml --step distill

teacher_model: meta-llama/Llama-3.2-3B
student_model: meta-llama/Llama-3.2-1B

dataset_name: wikimedia/wikipedia
dataset_config: 20231101.ko
dataset_revision: b04c8d1ceb2f5cd4588862100d08de323dccfbaa
dataset_text_column: text
dataset_streaming: true
dataset_max_samples: 1000
dataset_shuffle_buffer: 10000
validation_ratio: 0.05
test_ratio: 0.05

max_seq_length: 128
temperature: 2.0
alpha: 0.3
epochs: 1
batch_size: 1
learning_rate: 2.0e-5
seed: 42
num_workers: 2

device: cuda
bf16: true
optimizer: adafactor
gradient_checkpointing: true
output_dir: /tmp/kd-results/llama