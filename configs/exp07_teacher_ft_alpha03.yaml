# exp07: Teacher FT + α/epochs 튜닝 — WikiText-2
# exp06과 동일 모델/데이터, α와 epochs만 변경하여 효과 분리 확인
#   - α: 0.5 → 0.3 (Teacher FT로 teacher가 강해졌으므로 soft target 비중 확대)
#   - KD epochs: 3 → 5 (exp06에서 KD val CE 아직 하락 중, SFT는 ep2에서 정체)
# 목적: α/epochs 조정으로 KD가 FT를 이기는지 검증

teacher_model: gpt2
student_model: distilgpt2

dataset_name: wikitext
dataset_config: wikitext-2-raw-v1

max_seq_length: 256
temperature: 2.0
alpha: 0.3            # exp06: 0.5 → 0.3 (teacher 강할수록 α 낮추기)

# Teacher Fine-tuning
teacher_epochs: 3
teacher_learning_rate: 2.0e-5

# Student 학습
epochs: 5             # exp06: 3 → 5 (KD 수렴 여유 확보)
batch_size: 4
learning_rate: 5.0e-5
