# gemma3: 동료 generic-kd-v1 과 같은 FineWeb2 문서 묶음(train 6814 / validation 851 / test 851)과 같은 학습 조건.
# 첫 prepare 부터 --exposure-exclusion-file 로 동료 manifest 의 제외 목록을 준다.
family: gemma3
mode: fineweb_4way_same_cohort
teacher:
  id: google/gemma-3-12b-it
  revision: 96b6f1eccf38110c56df3a15bffe176da04bfd80
  device_map: auto
  max_memory:
    '0': 12GiB
    '1': 20GiB
student:
  id: google/gemma-3-1b-it
  revision: dcc83ea841ab6100d6b47a070329e1ba4cf78752
adapter:
  rank: 8
  alpha: 16
  dropout: 0.05
model:
  dtype: bfloat16
  attention: sdpa
data:
  max_documents: 10000
  seq_length: 512
training:
  seed: 42
  device: cuda
  batch_size: 1
  max_steps: 3000
  epochs: 100
  validation_interval: 200
  patience: 3
  min_delta: 0.0001
  checkpoint_interval_steps: 100
  teacher_learning_rate: 0.00002
  student_learning_rate: 0.00008
  alpha: 0.7
  temperature: 1.0
  divergence: forward_kl
