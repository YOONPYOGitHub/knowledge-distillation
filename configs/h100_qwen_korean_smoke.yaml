# Azure H100 single-GPU end-to-end smoke test
# 실행: python main.py configs/h100_qwen_korean_smoke.yaml --step distill

teacher_model: Qwen/Qwen2.5-3B
student_model: Qwen/Qwen2.5-1.5B

dataset_name: wikimedia/wikipedia
dataset_config: 20231101.ko
dataset_revision: b04c8d1ceb2f5cd4588862100d08de323dccfbaa
dataset_text_column: text
dataset_streaming: true
dataset_max_samples: 20
dataset_shuffle_buffer: 10000
validation_ratio: 0.1
test_ratio: 0.1

max_seq_length: 256
temperature: 2.0
alpha: 0.3
epochs: 1
batch_size: 2
max_train_steps: 2
max_eval_steps: 2
learning_rate: 2.0e-5
seed: 42
num_workers: 2

device: cuda
bf16: true
optimizer: adafactor
gradient_checkpointing: false
output_dir: /var/lib/kd-results/smoke/qwen