# exp08: α=0.2 + epochs=8 — KD가 FT를 이기는 전환점 실험
# exp07 대비 변경: α 0.3→0.2, epochs 5→8
# 근거:
#   - exp07에서 KD val_ce 5epoch까지 하강 중 (3.501), FT는 ep2에서 정체 (3.497)
#   - α 낮출수록 soft target 비중↑, Teacher FT PPL(25)이 충분히 강함
#   - 8 epoch이면 KD가 FT best를 넘을 수학적 여지 충분

teacher_model: gpt2
student_model: distilgpt2

dataset_name: wikitext
dataset_config: wikitext-2-raw-v1

max_seq_length: 256
temperature: 2.0
alpha: 0.2            # exp07: 0.3 → 0.2 (soft target 비중 80%)

# Teacher Fine-tuning
teacher_epochs: 3
teacher_learning_rate: 2.0e-5

# Student 학습
epochs: 8             # exp07: 5 → 8 (KD 수렴 여유 추가 확보)
batch_size: 4
learning_rate: 5.0e-5
