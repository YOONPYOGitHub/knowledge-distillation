# exp06: Teacher FT → KD — WikiText-2 smoke test
# 변경점: Teacher를 먼저 WikiText-2에 fine-tune한 뒤 KD 수행
# 목적: Teacher가 target domain에 최적화되면 KD가 FT를 이길 수 있는지 검증
# 예상 소요: WikiText-2 + MPS 기준 ~1시간 이내 (teacher FT + KD + baseline)

teacher_model: gpt2
student_model: distilgpt2

dataset_name: wikitext
dataset_config: wikitext-2-raw-v1

max_seq_length: 256
temperature: 2.0
alpha: 0.5

# Teacher Fine-tuning
teacher_epochs: 3
teacher_learning_rate: 2.0e-5

# Student 학습
epochs: 3
batch_size: 4
learning_rate: 5.0e-5
