# Gemma 3 12B -> 1B v4: 데이터 10배 + early stopping. Qwen v4(h100_qwen7b_korean_scale10k_v4) 에 맞춤.
# v3 대비 바뀐 것: 데이터 10배, 학습 길이(early stopping), KD 초기값과 divergence.
# KD 는 v3 요인 분리(docs/gemma3-v3-ablation.md) 결과에 따라 Base 초기값 + forward KL 로 한다.
# Base 초기값은 두 divergence 모두에서 SFT 초기값보다 유의하게 나았고, divergence 차이는 유의하지 않아
# 관측값이 가장 좋았던 forward 를 쓴다. T=2, α=0.5, tokenmean, top-K 128, lr 1e-5 는 v3 와 같다.
#
# Teacher FT -> Student SFT -> KD -> 평가를 모두 새 데이터로 다시 학습한다.
# test split 도 달라지므로(약 10배) v3 와 PPL 을 직접 비교하지 않는다. 비교는 v4 안의 4-way 와 bootstrap 으로 한다.
#
# 실행 (실패 시 멈추고, 같은 단계로 다시 실행하면 epoch 단위로 이어간다):
#   STOP_ON_FAIL=1 scripts/run_gemma3_4way.sh configs/gemma3_12b_1b_3090x4_v4.yaml
#
# GPU 배치 (KD 단계):
#   rank 0: Student 1B -> cuda:0 │ Teacher 12B int8 -> cuda:2
#   rank 1: Student 1B -> cuda:1 │ Teacher 12B int8 -> cuda:3

teacher_model: google/gemma-3-12b-pt
student_model: google/gemma-3-1b-pt

# --- 데이터: Qwen v4 와 동일 조건 ---
dataset_name: wikimedia/wikipedia
dataset_config: 20231101.ko
dataset_revision: b04c8d1ceb2f5cd4588862100d08de323dccfbaa
dataset_text_column: text
dataset_streaming: true
# v3 의 10배. Student SFT 가 1,000문서에서는 epoch 1 이후 바로 과적합했다.
dataset_max_samples: 10000
dataset_shuffle_buffer: 10000
validation_ratio: 0.05
test_ratio: 0.05
max_seq_length: 256
# Gemma 는 BOS 를 전제로 학습되어, 없으면 12B Teacher 가 1B 보다 나쁘게 측정된다.
prepend_bos: true

# --- KD: v3 요인 분리 결과 반영 (Base 초기값 + forward KL) ---
temperature: 2.0
alpha: 0.5
kd_reduction: tokenmean
kd_divergence: forward_kl
# Gemma vocab 262,208 은 Qwen 의 1.7배라 KD 손실 버퍼가 크다.
# top-K 로 목표 분포를 Teacher 상위 128개로 제한한다 (실측 2.15 -> 1.34 GB / batch 1).
kd_top_k: 128

# --- Teacher fine-tuning (QLoRA) ---
teacher_epochs: 3
teacher_learning_rate: 2.0e-5
teacher_lora_rank: 16
teacher_lora_alpha: 32
teacher_lora_dropout: 0.05
# vision tower 를 제외하고 언어 모델에만 LoRA 를 붙인다. vision 모듈은 텍스트 학습에서
# gradient 를 받지 않아 DDP 가 unused parameter 로 실패한다.
teacher_lora_target_modules: "^(?!.*vision).*\\.(q_proj|k_proj|v_proj|o_proj)$"
teacher_ft_quantization: nf4
teacher_checkpoint: results/gemma3/checkpoints/gemma3-12b-1b-v4/teacher_ft_best_adapter

# --- KD 단계 Teacher 배치 ---
teacher_quantization: int8
teacher_devices: [cuda:2, cuda:3]

# --- Student 학습: Qwen v4 와 동일 (epochs 4, early stopping) ---
epochs: 4
batch_size: 1
global_batch_size: 2
learning_rate: 1.0e-5
weight_decay: 0.01
gradient_clip: 1.0
optimizer: adafactor
# Teacher / SFT / KD 세 단계 모두에 적용된다.
early_stopping_patience: 1
early_stopping_min_delta: 0.005
seed: 42
training_seed: 42
num_workers: 2
# 비워 두면 pretrained Student 에서 KD 를 시작한다. Student SFT 는 4-way 의 Student (FT) 행을 위해서만 학습한다.
distill_student_checkpoint: ""
# epoch 이 수 시간 걸리므로 epoch 단위로 이어간다 (src/resume.py).
resume_training: true

device: cuda:0
bf16: true
gradient_checkpointing: true
# Gemma 3 는 학습 시 eager attention 을 권장한다.
attn_implementation: eager

output_dir: results/gemma3
run_id: gemma3-12b-1b-v4
