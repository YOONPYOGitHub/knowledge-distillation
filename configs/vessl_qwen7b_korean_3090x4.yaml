# Four physical GPUs, TWO student DDP ranks. Never launch with four ranks.
# rank 0: Student cuda:0 + frozen Teacher cuda:2
# rank 1: Student cuda:1 + frozen Teacher cuda:3
# Global batch remains 2, matching the completed Azure H100 v3 experiment.
teacher_model: Qwen/Qwen2.5-7B
