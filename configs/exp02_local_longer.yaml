# exp02: 로컬 2차 실험 — 패딩 왜곡 해소 + 수렴 확인
# 변경점: seq 128→256, epochs 1→3, batch 2→4

teacher_model: gpt2
student_model: distilgpt2

max_seq_length: 256       # 128→256: 패딩 비율 줄여 PPL 왜곡 완화
temperature: 4.0           # 3.0→4.0: softer distribution으로 KD 효과 강화
alpha: 0.3                 # 0.5→0.3: KL 비중 높여 Teacher 지식 더 반영

epochs: 3                  # 1→3: 수렴 추이 확인
batch_size: 4              # 2→4: 맥북에서 가능한 범위
learning_rate: 5.0e-5
