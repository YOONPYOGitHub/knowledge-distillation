# v4 model-selection experiment: 10x Korean data + early stopping.
# Fair order: Teacher LoRA FT -> Student FT -> FT-initialized Reverse-KL KD -> Evaluate.

teacher_model: Qwen/Qwen2.5-7B
student_model: Qwen/Qwen2.5-1.5B

dataset_name: wikimedia/wikipedia
dataset_config: 20231101.ko
dataset_revision: b04c8d1ceb2f5cd4588862100d08de323dccfbaa
dataset_text_column: text
dataset_streaming: true
dataset_max_samples: 10000
dataset_shuffle_buffer: 10000
validation_ratio: 0.05
test_ratio: 0.05

max_seq_length: 256
temperature: 2.0
alpha: 0.5
kd_reduction: tokenmean
kd_divergence: reverse_kl

teacher_epochs: 3
teacher_learning_rate: 2.0e-5
teacher_lora_rank: 16
teacher_lora_alpha: 32
teacher_lora_dropout: 0.05
teacher_checkpoint: /var/lib/kd-results/qwen7b-scale10k-v4/checkpoints/qwen7b-korean-scale10k-v4/teacher_ft_best_adapter

epochs: 4
batch_size: 2
learning_rate: 1.0e-5
weight_decay: 0.01
gradient_clip: 1.0
early_stopping_patience: 1
early_stopping_min_delta: 0.005
seed: 42
num_workers: 4

device: cuda
bf16: true
optimizer: adafactor
gradient_checkpointing: false
distill_student_checkpoint: /var/lib/kd-results/qwen7b-scale10k-v4/checkpoints/qwen7b-korean-scale10k-v4/student_ft_best.pt
output_dir: /var/lib/kd-results/qwen7b-scale10k-v4
run_id: qwen7b-korean-scale10k-v4
