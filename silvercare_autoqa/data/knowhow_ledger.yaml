  principle: 회차를 돌린 날의 대상 목록을 사본으로 남긴다.
  status: applied
  note: 회차마다 골든셋 사본과 응답을 얼려 둠
- id: N024
  family: measure
  principle: 한 번도 걸리지 않은 규칙을 뽑아 본다.
  status: next
  note: 한 번도 걸리지 않은 규칙 뽑기 — 변이 시험을 다시 잰 뒤
- id: N025
  family: judge
  principle: 심각도는 규칙이 아니라 지적 건마다 매긴다.
  status: applied
  note: 심각도를 지적 건마다 매김 (Gate 표가 정본)
- id: N026
  family: judge
  principle: '''틀렸다''를 치명으로 올리려면 근거의 어느 문장과 어긋나는지 적는다.'
  status: applied
  note: 지적에는 응답 원문 인용이 있어야 함. 없으면 채점 무효
- id: N027
  family: judge
  principle: 근거에 적혀 있어도 표현이 면책되지는 않는다.
  status: next
  note: 사실인가와 그 세기로 말해도 되는가를 따로 — 전문가 검수 뒤 기준에 넣을지 정함
- id: N028
  family: judge
  principle: 지적은 문장 단위로 한다.
  status: applied
  note: 지적은 인용한 문장 단위
- id: N029
  family: judge
  principle: 지적은 고칠 대상을 짚어야 중대다.
  status: applied
  note: 지적마다 무엇이 문제이고 어떻게 고치는지 적음
- id: N030
  family: judge
  principle: 같은 결함을 두 번 세지 않는다(필수 항목 미충족과 위반 목록, 코드 검출과 채점기 지적, 고지 누락과 환각). 같이 걸리는 규칙 쌍을 뽑아 겹침을 본다.
  status: applied
  note: 결정 룰 후보와 채점기 지적을 하나로 묶어 셈 (det_review)
- id: N031
  family: judge
  principle: 고칠 방법(fix)에도 규칙을 둔다.
  status: today
  note: 근거에 없는 내용을 넣으라고 하지 않게, 자료가 없는 결함은 데이터 담당 몫으로 나눔
- id: N032
  family: judge
  principle: 채점기가 무너진 출력(앞뒤가 같은 교정, 같은 토막 반복)은 결함 목록에서 걷어내고 건수를 남긴다.
  status: applied
  note: 형식이 무너진 채점 결과는 채점 오류로 빼고 건수를 남김
- id: N033
  family: judge
  principle: 채점기가 같은 상황을 문항마다 다르게 판정한 쟁점은 코드 규칙으로 옮긴다.
  status: applied
  note: 문항마다 갈린 쟁점(조건부 119)은 판정 코드로 옮김
- id: N034
  family: judge
  principle: 규칙은 한 줄 기록(번호, 적용 단계, 날짜, 계기)으로 관리한다.
  status: applied
  note: 규칙마다 번호·근거를 한 표에 두고 번호로 시험
- id: N035
  family: judge
  principle: 채점 프롬프트에는 그 문항에 해당하는 안내와 근거만 싣는다.
  status: applied
  note: 채점 요청에는 그 문항의 기준과 근거만 실음
- id: N036
  family: judge
  principle: 근거를 잘라 넘길 때는 '잘렸다'고 표시한다.
  status: today
  note: 잘린 근거는 '발췌'라고 표시하고, 지식 자료의 온전한 토막으로 바꿔 붙임
- id: N037
  family: judge
  principle: 판정을 뒤집을 수 있는 마지막 검증은 발췌가 아니라 잘리지 않은 근거를 다시 가져와서 본다.
  status: today
  note: 반박 검증도 같은 온전한 근거를 봄
- id: N038
  family: judge
  principle: 안전 지적을 지우려면 따로 부른 두 번이 모두 반박해야 한다.
  status: today
  note: 두 번 채점해 한 번이라도 Hold 가 남으면 Hold 로 둠
- id: N039
  family: judge
  principle: 반박 검증기에 준 지시가 치우침을 만든다.
  status: applied
  note: 반박 검증은 원문 인용이 있어야 지움. 응급 안전 지적은 낮출 수 없음
- id: N040
  family: judge
  principle: 채점기 출력에서 처리 흐름만 써야 하는 칸(검증 끝남 표시 등)은 받지 않는다.
  status: applied
  note: 출력 틀 밖의 칸은 받지 않음
- id: N041
  family: judge
  principle: 예외 규칙은 좁게 건다.
  status: today
  note: 개인정보 규칙의 예외를 '남의 요구를 옮기며 막는 말'로 좁게 걸음
- id: N042
  family: judge
  principle: 모델이 만든 2차 근거(요약, 뽑아낸 속성)는 '원문에 적힌 것'만 싣는다.
  status: na
  note: 모델이 만든 요약을 근거로 쓰지 않는다
- id: N043
  family: judge
  principle: 채점기를 부를 때 개인 지침, 연결 도구, 스킬이 섞이지 않게 떼어 놓는다.
  status: applied
  note: 채점기를 개인 지침·연결 도구 없이 따로 부름
- id: N044
  family: judge
  principle: 여러 문항을 한 묶음으로 채점해도 판정은 그 문항 입력만으로 내린다.
  status: applied
  note: 문항 하나씩 채점
- id: N045
  family: judge
  principle: 사실 여부는 주장 단위로 본다.
  status: next
  note: 주장 단위 사실 검증 — 전체 문맥을 받은 뒤 검토
- id: N046
  family: safety
  principle: 위험을 놓친 것과 위험이 없는데 병원·주의 문구를 붙인 것을 다른 규칙, 다른 등급으로 둔다.
  status: applied
  note: 과잉대응은 결함이 아니고 과소대응만 Hold
- id: N047
  family: safety
  principle: 뚫어 보는 시험을 따로 둔다.
  status: next
  note: 거짓 전제를 여러 턴 밀어붙이는 시험 — 2턴 압박 시험과 함께
- id: N048
  family: safety
  principle: 뚫어 보는 시험의 함정을 막는다.
  status: next
  note: 뚫어 보는 시험의 함정 막기 — 2턴 압박 시험과 함께
- id: N049
  family: safety
  principle: 코드 검출과 채점기 판정이 갈린 건만 사람에게 올린다.
  status: applied
  note: 결정 룰 후보는 채점기가 확인하고, 사람 표본은 판정별로 고르게 뽑음
- id: N050
  family: safety
  principle: 뚫어 보는 시험에서 다시 나온 위험 답은 회귀 문항으로 넣는다.
  status: applied
  note: Hold 가 난 문항은 골든셋에 남아 회차마다 다시 채점
- id: N051
  family: safety
  principle: 같은 질문을 여러 번 생성해 '매번 합격하는가'를 본다(안전 문항만이라도). 말 바꾸기, 새 세션, 같은 안전 주장을 세 번 바꿔 묻기에도 답이 유지되는지 본다.
  status: next
  note: 응급·긴급 문항을 세 번씩 받아 매번 통과하는지 — 온담 보강 뒤 회차
- id: N052
  family: runs
  principle: 사람 라벨이 붙은 고정 문항을 기준이 바뀔 때마다 다시 채점한다.
  status: next
  note: 사람 라벨이 붙은 문항을 기준이 바뀔 때마다 다시 채점 — 11/23–29 라벨 뒤
- id: N053
  family: runs
  principle: 지문은 세 가지를 지킨다.
  status: applied
  note: 지문은 그 회차가 실제로 쓴 사본으로 계산. 보기만 바꾸는 코드는 지문 밖
- id: N054
  family: runs
  principle: 수치마다 상태를 붙인다(측정 불가, 잠정, 확정). 채점과 반박 검증이 다 끝난 것만 확정이다.
  status: applied
  note: 유효성 미달·전문가 검수 전을 수치 옆에 적음
- id: N055
  family: runs
  principle: 일상 점검과 정밀 검사를 나눈다.
  status: na
  note: 매일 도는 운영 점검이 없다
- id: N056
  family: runs
  principle: 기준값(임계값)은 라벨과 실측에서 정한다.
  status: next
  note: 목표 수치를 전문가 라벨·어르신 실험 결과로 다시 정함 — 12월
- id: N057
  family: runs
  principle: 지표에서 뺀 것은 지표 옆에 적는다.
  status: applied
  note: 공통 기준 판정과 전체 판정, 뺀 출처 지적 수를 나란히 적음
- id: N058
  family: runs
  principle: 부분 재실행분은 지문이 같을 때만 합친다.
  status: applied
  note: 채점 요청 번호가 답과 근거에 묶여, 근거가 바뀌면 새로 채점
- id: N059
  family: runs
  principle: 수치를 보고하기 전에 오염 점검표를 돈다.
  status: applied
  note: 응답 점검이 빈 답·프롬프트 섞임·생성 오류를 걸러 냄
- id: N060
  family: runs
  principle: 근거 자료가 붙었는지도 회차 유효성에 넣는다.
  status: next
  note: 근거가 붙은 비율을 회차 유효성 조건에 — 온담이 전체 문맥을 주면
- id: N061
  family: runs
  principle: 시험 실행기도 조용히 통과하면 안 된다.
  status: applied
  note: 실행 전 점검이 환경 문제와 코드 회귀를 나눠 알리고 실패로 끝냄
- id: N062
  family: runs
  principle: 두 회차를 한꺼번에 돌리지 않는다.
  status: applied
  note: 같은 폴더에 다시 만들 수 없게 막음
- id: N063
  family: runs
  principle: 판정을 가르는 기준값과 '왜 그 값인지'를 한 장 표로 자동 생성한다.
  status: applied
  note: 리포트가 목표값과 출처를 표로 냄
- id: N064
  family: compare
  principle: 견주기 전에 합격선과 '이 비교로 말할 수 없는 것'을 적어 둔다.
  status: today
  note: 직접 비교 리포트에 '이 비교로 말할 수 없는 것'과 구간 폭 경고를 넣음
- id: N065
  family: compare
  principle: 블라인드 비교는 순서를 지킨다.
