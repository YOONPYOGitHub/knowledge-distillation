  note: 각자 채점을 먼저 하고 나란히 비교. '둘 다 못 씀' 수를 따로 적음
- id: N066
  family: compare
  principle: 같은 과제로 한 비교와 실제 사용 기록을 합치지 않는다.
  status: na
  note: 실제 사용 기록이 아직 없다
- id: N067
  family: compare
  principle: 비교 실행은 서로 떼어 놓는다(새 세션, 앞 대화 없음). 실행 순서를 돌린다.
  status: applied
  note: 질문마다 새 대화로 받고, 비교 상대를 '로그인 안 한 무료 기본'이라고 구성째 적음
- id: N068
  family: compare
  principle: 시스템 비교의 분모는 '미리 배정한 전체'다.
  status: today
  note: 분모는 골든셋 전체. 한쪽 답이 없으면 판정 보류, 우리 쪽 Hold 는 전체 답에서 셈
- id: N069
  family: compare
  principle: 근거를 찾아 답하는 시스템(RAG)의 문항은 모범 답안 대신 다섯 칸을 실행 전에 정해 둔다.
  status: next
  note: 자료가 부딪힐 때 무엇을 따르나 칸 — 골든셋 v1
- id: N070
  family: compare
  principle: RAG는 찾는 단계와 답하는 단계를 따로 본다.
  status: applied
  note: 없는 출처 번호를 코드로 확정하고, 실패 원인을 찾기·답하기로 나눔
- id: N071
  family: compare
  principle: 서로 견준 지표(순위, 합격률 차이)만 보지 않는다.
  status: today
  note: 견주기 전에 같은 답 두 번 채점이 얼마나 갈리는지부터 잼
- id: N072
  family: compare
  principle: 다른 검수기의 장치를 옮길 때 네 가지를 지킨다.
  status: applied
  note: 옮긴 것과 안 옮긴 것을 이유와 함께 감사 기록에 적음
- id: N073
  family: loop
  principle: 합격률 하나를 대표 숫자로 쓰지 않는다.
  status: applied
  note: 합격률 하나가 아니라 Hold 수·Gate·지표 일곱 개를 같이 냄
- id: N074
  family: loop
  principle: 공유 리포트는 분량을 지킨다.
  status: applied
  note: 고칠 순서대로 문항을 싣고 전체는 CSV 로 냄
- id: N075
  family: loop
  principle: 요약 보고문은 코드가 만든다.
  status: applied
  note: 리포트 첫 화면 요약을 코드가 만듦
- id: N076
  family: loop
  principle: 큰 결함은 한 줄에 한 사례로 쓴다("사용자가 무엇을 하면 무엇이 나온다"). 실제 화면을 붙인다.
