version: '2026-11-15'
about: 쇼핑 AI 검수에서 가져온 원칙을 하나씩 대조한 장부. applied = 전부터 들어 있음 · today = 2026-11-15 에 넣음 · next = 넣을 때가 정해진 것 · na = 이 프로젝트에 맞지 않음. 원칙 문장만 옮겼다.
families:
