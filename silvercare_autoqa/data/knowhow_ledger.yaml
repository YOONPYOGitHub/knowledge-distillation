  note: 큰 결함을 한 줄 한 사례로 발표 자료에 실음 (docs/autoqa/talk)
- id: N077
  family: loop
  principle: 리포트와 라벨 시트의 발췌는 근거 문구부터 넣고 자른다.
  status: next
  note: 채점지 발췌를 근거 문구부터 — 11/23 전
- id: N078
  family: loop
  principle: 공유본에 무엇을 넣을지 두 규칙이 서로 당긴다.
  status: applied
  note: 뺀 것·못 잰 것을 리포트에 적는 쪽을 따름
- id: N079
  family: loop
  principle: 확정된 사양에 대한 불만은 결함이 아니라 '사양 반대 신호'로 따로 센다.
  status: applied
  note: 기준이 엄격해 갈리는 문항은 전문가 검수 안건으로 따로 적음
- id: N080
  family: human
  principle: 사람끼리 일치도를 먼저 본다(κ 0.7 이상). 그다음 채점기와 사람을 견준다(κ 0.6 이상). 기준이 바뀌면 다시 맞춘다.
  status: next
  note: 약사·간호사 두 사람의 일치도를 먼저 봄 — 11/23–29
- id: N081
  family: human
  principle: κ는 다섯 가지를 지켜 읽는다.
  status: next
  note: κ 를 묶는 법 두 가지·영역별로 — 11/23–29
- id: N082
  family: human
  principle: 사람 라벨 시트에는 판정에 필요한 근거(그때의 원문, 근거 발췌)를 같이 싣는다.
  status: next
  note: 채점지에 판정에 필요한 근거를 실음 — 11/23 전
- id: N083
  family: human
  principle: 기준이나 누구 몫인지가 바뀌어 대상이 달라진 사람 라벨은 기계가 옮기지 않는다.
