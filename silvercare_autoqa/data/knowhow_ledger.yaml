  note: 답이 바뀐 라벨은 옮기지 않고 다시 볼 목록으로 냄 (human)
- id: N084
  family: human
  principle: 결함 등재는 사람이 한다.
  status: applied
  note: 리포트에 골든셋 검수 상태를 늘 적음
- id: N085
  family: human
  principle: 선례집을 규칙대로 쓴다.
  status: next
  note: 판례 기록 — 11/23 전
- id: N086
  family: loop
  principle: 「이것부터 고치면」 표를 만든다.
  status: today
  note: 고칠 것을 하나씩 뺐을 때 통과가 가장 많이 느는 순서를 계산 (fix-first)
- id: N087
  family: loop
  principle: 고칠 순서를 정하기 전에 그 결함을 실제로 겪는 사람이 얼마나 되는지 사용 기록으로 견준다.
  status: next
  note: 고객 질문 빈도로 무게를 달기 — 사용 기록이 생긴 뒤
- id: N088
  family: loop
  principle: 결함을 넘기기 전에 그 시스템이 실제로 받은 값이나 실제 화면을 본 증거를 붙인다.
  status: today
  note: 넘기는 결함마다 답이 나간 길(mode)·돌려받은 출처를 붙임
- id: N089
  family: loop
  principle: 합불을 '고칠 사람' 단위(영역)로 낸다.
  status: today
  note: 통과를 고칠 사람 단위로 냄 (fix-first 담당별)
- id: N090
  family: loop
  principle: 결함을 네 갈래로 나눠 다른 곳에 보낸다.
  status: today
  note: 지식이 없음 · 모자람 · 못 찾음 · 답 쓰는 규칙으로 갈라 다른 담당에게 보냄
- id: N091
  family: loop
  principle: 실제 사용자 불만을 회귀 문항으로 만들고 이슈별 상태표를 낸다(풀림, 안 풀림, 상류 대기, 계측만). 신고는 신고자가 고른 분류가 아니라 내용으로 다시 나눈다.
  status: na
  note: 아직 실제 사용자 불만이 없다 (어르신 실험 뒤 다시 봄)
- id: N092
  family: loop
  principle: '''이번에 안 나왔다''를 ''고쳐졌다''로 쓰지 않는다.'
  status: today
  note: 좋아진 문항은 '이번 회차에 안 나옴'으로 적음 (diff-runs)
- id: N093
  family: loop
  principle: 결함 수가 줄면 사라진 항목을 이름으로 뽑는다.
  status: today
  note: 사라진 결함을 문항 이름으로 뽑음 (diff-runs)
- id: N094
  family: loop
  principle: 고치기 전에 효과를 무엇으로 잴지 적는다.
  status: today
  note: 고치기 전에 무엇으로 다시 잴지 요청서에 적음
- id: N095
  family: loop
  principle: 기준 변경은 회차 경계에서만 넣는다.
  status: applied
  note: 기준이 바뀌면 지문이 달라 앞 회차에 섞이지 않음
- id: N096
  family: loop
  principle: 기준을 풀 때는 같은 채점 결과에 판정식만 다시 돌린다.
  status: today
  note: 규칙을 고친 전후를 같은 답으로 대조해 바뀐 판정을 모두 읽음
- id: N097
  family: loop
  principle: 규칙 후보는 사람 라벨에 모두 대어 보고 고른다.
  status: next
  note: 규칙 후보를 사람 라벨에 대어 고름 — 11/23–29 뒤
- id: N098
  family: loop
  principle: 실제 사용자 조사로 엄격함을 다시 나눈다.
  status: next
  note: 어르신 실험 결과로 엄격함을 다시 나눔 — 12월
- id: N099
  family: loop
  principle: 자동검수 합격률은 '미리 보는 지표'로만 쓴다.
  status: next
  note: 통과율을 어르신 실험 지표와 나란히 봄 — 12월 (study-analyze)
- id: N100
  family: loop
  principle: 실제 대화 1건마다 '풀림, 일부 풀림, 안 풀림, 범위 밖'과 안 풀린 까닭을 판정한다.
  status: na
  note: 실제 대화 기록이 없다
- id: N101
  family: loop
  principle: RAG 시스템은 못 답한 질문을 주마다 모아 갈래를 나눈다(이미 풀림, 지식이 없음, 지식은 있는데 못 찾음, 범위 밖이라 기권이 맞음, 시험용 질문). 기권 기록을 공부할 목록으로 쓴다.
  status: today
  note: 못 답한 까닭을 갈래로 나누고, 온담 답을 지식에 다시 넣지 않게 요청서에 적음
- id: N102
  family: loop
  principle: 개선의 첫 질문은 '무엇을 더 넣을까'가 아니다.
  status: today
  note: '더 넣기 전에 켜져 있는지부터: 일상 대화 길·거절·출처 0개를 먼저 셈'
- id: N103
  family: loop
  principle: 고치기 전에 다섯 가지를 본다.
  status: today
  note: 고치기 전에 그 방향의 상한을 싸게 잼 (fix-first)
- id: N104
  family: loop
  principle: 검수 도구를 뚫어 보는 감사도 절차로 한다.
  status: applied
  note: 감사 지적도 코드로 확인한 뒤 고치고, 고친 것과 남긴 것을 나눠 적음
- id: N105
  family: loop
  principle: 결함 장부를 하나로 둔다.
  status: next
  note: 회차를 넘는 결함 장부 하나 — 온담 보강 회차부터
- id: N106
  family: loop
  principle: 자동 개선은 제안 초안까지만 한다.
  status: applied
  note: autoqa 는 고칠 곳을 제안만 하고, 온담은 담당이 고침
- id: N107
  family: loop
  principle: 리포트와 안내문을 그 도구를 만들지 않은 사람 눈으로 따로 검토한다.
  status: applied
  note: 처음 읽는 사람 검토와 문서 자동 검사
- id: N108
  family: loop
  principle: 두 시스템을 견줄 때는 둘에 똑같이 물을 수 있는 기준만 쓴다.
  status: applied
  note: 견줄 때는 둘에 똑같이 물을 수 있는 기준만 씀 (공통 기준 판정)
