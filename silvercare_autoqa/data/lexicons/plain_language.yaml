# 쉬운 말 용어집 — 어르신 응답에서 피할 말과 바꿀 말.
# 바로 뒤 괄호에 쉬운 설명이 붙어 있으면 (예: "고관절(엉덩이뼈)") 어려운 말로 세지 않는다.
# 판정은 KPI(쉬운 표현 점수)에만 쓴다. 이 목록에 걸렸다고 불합격시키지 않는다.

version: 1

hard_words:
  복용: "드시기"
  섭취: "드시기"
  투약: "약 드리기"
  투여: "약 드리기"
  내원: "병원에 오시기"
  경구: "입으로"
  용법: "먹는 방법"
  용량: "먹는 양"
  금기: "먹으면 안 되는 경우"
  상호작용: "같이 먹을 때 생기는 문제"
  질환: "병"
  합병증: "함께 생기는 다른 병"
  기저질환: "원래 앓던 병"
  의식 저하: "정신이 흐려짐"
  의식저하: "정신이 흐려짐"
  호흡곤란: "숨이 참"
  혈전: "피떡"
  항응고제: "피를 묽게 하는 약"
  항혈소판제: "피를 묽게 하는 약"
  탈수: "몸에 물이 모자람"
  부종: "붓기"
  오심: "메스꺼움"
  경과 관찰: "지켜보기"
  수분: "물"
  염분: "소금"
  나트륨: "소금"
  체중: "몸무게"
  혈중: "피 속"
  모니터링: "살펴보기"
  권장: "좋다"
  지양: "피하기"
  요망: "필요"
  소견: "의견"
  즉시: "바로"
  신속히: "빨리"
  내지: "또는"
  유의: "조심"
  병용: "같이 먹기"
  처치: "조치"
  진정제: "마음을 가라앉히는 약"
  비스테로이드: "진통소염제"
  NSAID: "진통소염제"
  INR: "피가 굳는 정도 수치"
  GI: "위장"

# 한 문장이 이 글자 수를 넘으면 긴 문장으로 센다 (공백 포함).
long_sentence_chars: 60

# 쉬운 표현 점수(100점 만점) 감점표
plain_score:
  per_hard_word: 8
  hard_word_cap: 40
  # 2026-11-14 사용자 결정: 답 길이(문장 수)는 판정·Scorecard 에 넣지 않는다.
  # 대신 채점기의 '간결 전달 점수(보조)'로 본다 — 핵심 정보를 빠짐없이, 바로 알아듣게, 짧게 전했나.
  per_extra_sentence: 0
  extra_sentence_cap: 0
  per_long_sentence: 5
  long_sentence_cap: 15
  banmal: 15                  # 반말 문장이 하나라도 있으면
