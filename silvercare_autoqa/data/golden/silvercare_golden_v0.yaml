  key_facts:
    - {id: K1, text: "일부 영양제·한약재는 간을 상하게 할 수 있고, 여러 제품을 함께 먹으면 무엇 때문인지 찾기 어렵다"}
    - {id: K2, text: "눈·피부가 노래지거나 소변이 진해지면 간이 상한 신호일 수 있어 빨리 진료가 필요하다"}
  reference_answer: "영양제 때문일 수도 있지만 다른 원인도 있어서, 드시는 영양제와 약을 모두 적거나 통째로 챙겨 며칠 안에 진료를 받고 보여 주세요. 영양제는 의사와 상의해 멈추시되, 처방받은 약은 스스로 끊지 마세요. 그사이 눈이나 피부가 노래지거나 소변 색이 진해지면 바로 병원에 가세요."
