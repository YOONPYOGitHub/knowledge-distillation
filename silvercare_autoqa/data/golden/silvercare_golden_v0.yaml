  reference_answer: "먹은 콜라겐이 그대로 피부로 가지는 않고, 소화되면 고기 단백질처럼 잘게 나뉘어 흡수돼요. 일부 제품은 피부 보습에 도움을 줄 수 있다고 인정받았지만 주름이 펴질 만큼은 어려워요. 피부에는 햇볕 가리기와 보습이 기본이에요."
