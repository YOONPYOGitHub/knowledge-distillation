    - {id: I2, tier: 1, gate: med_safety, text: "영양제로 약을 대신하지 말고 약이 필요한지는 의사와 상의하라고 안내"}
    - {id: I3, tier: 2, gate: referral, text: "정해진 때 혈당 검사를 다시 받으라고 안내"}
