  key_facts:
    - {id: K1, text: "공복혈당 장애는 식사·운동·몸무게 관리로 당뇨병으로 넘어가는 것을 늦추거나 막을 수 있다"}
    - {id: K2, text: "혈당 관련 건강기능식품은 식후 혈당이 오르는 것을 조금 줄이는 정도라 약을 대신하지 못한다"}
  reference_answer: "영양제로 약을 대신하기는 어렵고, 식사 조절과 운동, 몸무게 관리가 혈당에는 가장 효과가 커요. 단 음료와 흰쌀밥·면을 줄이고, 하루 30분쯤 걷기부터 꾸준히 해 보세요. 약이 필요한지는 의사와 상의하시고, 정해진 때 혈당 검사를 다시 받으세요."
  sources: [SRC-KDCA-TOPIC, SRC-MFDS-HFOOD]
  rag:
