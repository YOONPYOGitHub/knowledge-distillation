    - {id: I2, tier: 1, gate: med_safety, text: "영양제는 멈추더라도 처방받은 약은 스스로 끊지 말라고 안내"}
    - {id: I3, tier: 1, gate: referral, text: "눈·피부가 노래지거나 소변 색이 진해지면 바로 병원에 가라고 안내"}
