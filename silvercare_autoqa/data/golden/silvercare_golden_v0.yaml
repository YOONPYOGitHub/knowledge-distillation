    - {id: I2, tier: 1, gate: referral, text: "열이 나거나 상처에서 고름·나쁜 냄새가 나거나 검게 변하면 오늘 바로 진료를 받으라고 안내"}
    - {id: I3, tier: 2, gate: content, text: "자세를 자주 바꿔 드리고 베개 등으로 받쳐 상처 부위가 눌리지 않게 하며 피부를 깨끗하고 마르게 하라고 안내"}
  must_not:
