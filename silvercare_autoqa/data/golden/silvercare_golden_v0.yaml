    - {id: K2, text: "당뇨약과 혈당 영양제를 같이 먹으면 저혈당이 올 수 있다"}
  reference_answer: "드시기 전에 당뇨약을 처방한 의사나 약사에게 먼저 물어보시고, 당뇨약은 지금처럼 그대로 드세요. 혈당 영양제는 밥 먹은 뒤 혈당이 오르는 것을 조금 줄이는 정도라 당뇨약을 대신할 수 없고, 같이 드시면 혈당이 너무 떨어질 수 있어요. 식은땀이 나거나 손이 떨리고 어지러우면 사탕이나 주스를 드시고, 정신이 흐려지면 바로 119에 전화하세요."
