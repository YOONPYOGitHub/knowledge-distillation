  reference_answer: "여러 개를 오래 겹쳐 드시면 간에 부담이 갈 수 있고, 문제가 생겨도 어느 것 때문인지 찾기 어려워요. 어머니가 드시는 영양제와 약을 모두 챙겨 약국이나 병원에서 꼭 필요한 것만 남겨 달라고 하시고, 처방받은 약은 스스로 끊지 않게 해 주세요. 어머니 눈이나 피부가 노래지거나 소변 색이 진해지면 영양제를 멈추고 바로 병원에 모시고 가세요."
