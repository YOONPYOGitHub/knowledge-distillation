  review_note: "SRC-KDCA-TOPIC = 「노인 당뇨병」(5306). '하루 30분쯤 걷기'는 주 150분 운동 권고를 쉬운 말로 옮긴 것 — 전문가 확인. 혈당 기능 원료(바나바잎·난소화성말토덱스트린 등) 이름은 답에 넣지 않았음."

